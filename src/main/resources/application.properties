# ===================================================================
# FullStack Backend Configuration
# ===================================================================

# Application Server Port
server.port=8008

# Application Name
spring.application.name=fullstack-backend

# MongoDB Database Connection Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/training_batch_management}

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# Logging
logging.level.com.fullstack.backend=INFO
logging.level.org.springframework.data.mongodb=INFO
